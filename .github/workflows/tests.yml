name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unit-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -e '.[geo,api,dev]'
      - name: Unit and reference regression tests
        run: python -m pytest
