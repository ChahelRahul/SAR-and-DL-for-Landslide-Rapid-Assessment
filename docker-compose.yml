name: sar-lra

x-sar-lra-common-env: &sar-lra-common-env
  SAR_LRA_REDIS_URL: redis://redis:6379/0
  SAR_LRA_API_INPUT_ROOT: /input
  SAR_LRA_API_OUTPUT_ROOT: /output
  SAR_LRA_JOB_RETENTION_SECONDS: ${SAR_LRA_JOB_RETENTION_SECONDS:-86400}
  SAR_LRA_JOB_TIMEOUT_SECONDS: ${SAR_LRA_JOB_TIMEOUT_SECONDS:-3600}
  SAR_LRA_JOB_MAX_ATTEMPTS: ${SAR_LRA_JOB_MAX_ATTEMPTS:-3}
  SAR_LRA_MAX_QUEUED_JOBS: ${SAR_LRA_MAX_QUEUED_JOBS:-100}
  SAR_LRA_MIN_FREE_DISK_MB: ${SAR_LRA_MIN_FREE_DISK_MB:-1024}
  SAR_LRA_S3_ENDPOINT_URL: http://minio:9000
  SAR_LRA_S3_BUCKET: ${SAR_LRA_S3_BUCKET:-sar-lra-results}
  SAR_LRA_S3_PREFIX: ${SAR_LRA_S3_PREFIX:-jobs}
  AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-sar-lra-admin}
  AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-change-this-password}
  AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
  SAR_LRA_ACQUISITION_PROVIDER: ${SAR_LRA_ACQUISITION_PROVIDER:-auto}
  PC_SDK_SUBSCRIPTION_KEY: ${PC_SDK_SUBSCRIPTION_KEY:-}

services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sar-lra-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-password}
    ports:
      - "${SAR_LRA_MINIO_API_PORT:-9000}:9000"
      - "${SAR_LRA_MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-03-12T17-29-24Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sar-lra-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-this-password}
      SAR_LRA_S3_BUCKET: ${SAR_LRA_S3_BUCKET:-sar-lra-results}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb --ignore-existing "local/$${SAR_LRA_S3_BUCKET}"
        mc anonymous set none "local/$${SAR_LRA_S3_BUCKET}"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${SAR_LRA_IMAGE:-sar-lra:cpu}
    entrypoint: ["sar-lra-api"]
    environment:
      <<: *sar-lra-common-env
    ports:
      - "${SAR_LRA_API_PORT:-8000}:8000"
    volumes:
      - ${SAR_LRA_INPUT_DIR:-./input}:/input:ro
      - sar-lra-results:/output
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
    mem_limit: ${SAR_LRA_API_MEMORY_LIMIT:-1g}
    cpus: ${SAR_LRA_API_CPUS:-1.0}
    pids_limit: ${SAR_LRA_API_PIDS_LIMIT:-256}
    restart: unless-stopped

  worker:
    image: ${SAR_LRA_IMAGE:-sar-lra:cpu}
    entrypoint: ["sar-lra-worker"]
    environment:
      <<: *sar-lra-common-env
    volumes:
      - ${SAR_LRA_INPUT_DIR:-./input}:/input:ro
      - sar-lra-results:/output
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    mem_limit: ${SAR_LRA_WORKER_MEMORY_LIMIT:-8g}
    cpus: ${SAR_LRA_WORKER_CPUS:-4.0}
    pids_limit: ${SAR_LRA_WORKER_PIDS_LIMIT:-512}
    stop_grace_period: 30s
    restart: unless-stopped

  cli:
    profiles: ["cli"]
    image: ${SAR_LRA_IMAGE:-sar-lra:cpu}
    entrypoint: ["sar-lra"]
    environment:
      SAR_LRA_API_INPUT_ROOT: /input
      SAR_LRA_API_OUTPUT_ROOT: /output
    volumes:
      - ${SAR_LRA_INPUT_DIR:-./input}:/input:ro
      - ${SAR_LRA_CLI_OUTPUT_DIR:-./results}:/output
    working_dir: /work

volumes:
  redis-data:
  minio-data:
  sar-lra-results:
